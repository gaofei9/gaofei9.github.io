draft: true

page:
  title: "Key readings"
  eyebrow: "Key readings"
  heading: "Ideas that shaped how we think about learning"
  intro: >-
    Here are a collection of papers that has influenced my
    thinking about learning and learning design.

  # Shown in smaller type under the intro. HTML ok.
