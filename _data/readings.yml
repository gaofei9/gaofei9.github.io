domains:
  # ---------------------------------------------------------
  - name: "Feedback"
    status: ready
    # One entry per paragraph.
    intro_paragraphs:
      - >-
        Feedback is one of the most studied ideas in education and one of the
        most widely used practices. But are we doing it well?
      - >-
        Research shows that feedback can improve learning, but it can also have
        little effect or even backfire. Much depends on what the feedback
        focuses on, how and when it is delivered, and what the learner does
        with it.
      - >-
        The papers below examine feedback from different angles. Together, they
        give us a useful framework for thinking about what makes feedback
        effective and how we can use it more thoughtfully in practice.
    groups:
      - heading: "The central tension"
        papers:
          - citation: >-
              Hattie, J., &amp; Timperley, H. (2007). The power of feedback.
              <em>Review of Educational Research, 77</em>(1), 81–112.
            url: "https://doi.org/10.3102/003465430298487"
          - citation: >-
              Kluger, A. N., &amp; DeNisi, A. (1996). The effects of feedback
              interventions on performance: A historical review, a meta-analysis,
              and a preliminary feedback intervention theory.
              <em>Psychological Bulletin, 119</em>(2), 254–284.
            url: "https://doi.org/10.1037/0033-2909.119.2.254"

      - heading: "Feedback as part of assessment"
        papers:
          - citation: >-
              Sadler, D. R. (1989). Formative assessment and the design of
              instructional systems. <em>Instructional Science, 18</em>(2), 119–144.
            url: "https://doi.org/10.1007/BF00117714"
          - citation: >-
              Black, P., &amp; Wiliam, D. (1998). Assessment and classroom learning.
              <em>Assessment in Education: Principles, Policy &amp; Practice, 5</em>(1),
              7–74.
            url: "https://doi.org/10.1080/0969595980050102"
          - citation: >-
              Shute, V. J. (2008). Focus on formative feedback.
              <em>Review of Educational Research, 78</em>(1), 153–189.
            url: "https://doi.org/10.3102/0034654307313795"

      - heading: "Feedback and self-regulated learning"
        papers:
          - citation: >-
              Butler, D. L., &amp; Winne, P. H. (1995). Feedback and self-regulated
              learning: A theoretical synthesis.
              <em>Review of Educational Research, 65</em>(3), 245–281.
            url: "https://doi.org/10.3102/00346543065003245"
          - citation: >-
              Winne, P. H., &amp; Hadwin, A. F. (1998). Studying as self-regulated
              learning. In D. J. Hacker, J. Dunlosky, &amp; A. C. Graesser (Eds.),
              <em>Metacognition in educational theory and practice</em> (pp. 277–304).
              Erlbaum.
            url: ""
          - citation: >-
              Nicol, D. J., &amp; Macfarlane-Dick, D. (2006). Formative assessment and
              self-regulated learning: A model and seven principles of good feedback
              practice. <em>Studies in Higher Education, 31</em>(2), 199–218.
            url: "https://doi.org/10.1080/03075070600572090"

      - heading: "Feedback in digital environments"
        papers:
          - citation: >-
              Narciss, S. (2008). Feedback strategies for interactive learning tasks.
              In J. M. Spector, M. D. Merrill, J. van Merriënboer, &amp; M. P. Driscoll
              (Eds.), <em>Handbook of research on educational communications and
              technology</em> (3rd ed., pp. 125–143). Erlbaum.
            url: ""
          - citation: >-
              van der Kleij, F. M., Feskens, R. C. W., &amp; Eggen, T. J. H. M. (2015).
              Effects of feedback in a computer-based learning environment on students'
              learning outcomes: A meta-analysis.
              <em>Review of Educational Research, 85</em>(4), 475–511.
            url: "https://doi.org/10.3102/0034654314564881"

      - heading: "The recent turn: what students do with feedback"
        papers:
          - citation: >-
              Boud, D., &amp; Molloy, E. (2013). Rethinking models of feedback for
              learning: The challenge of design.
              <em>Assessment &amp; Evaluation in Higher Education, 38</em>(6), 698–712.
            url: "https://doi.org/10.1080/02602938.2012.691462"
          - citation: >-
              Carless, D., &amp; Boud, D. (2018). The development of student feedback
              literacy: Enabling uptake of feedback.
              <em>Assessment &amp; Evaluation in Higher Education, 43</em>(8), 1315–1325.
            url: "https://doi.org/10.1080/02602938.2018.1463354"
          - citation: >-
              Wisniewski, B., Zierer, K., &amp; Hattie, J. (2020). The power of feedback
              revisited: A meta-analysis of educational feedback research.
              <em>Frontiers in Psychology, 10</em>, 3087.
            url: "https://doi.org/10.3389/fpsyg.2019.03087"

