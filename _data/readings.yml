page:
  title: "Key readings"
  eyebrow: "Key readings"
  heading: "Ideas that shaped how we think about learning"
  intro: >-
    These are the papers I return to, grouped by the idea they belong to.
    The aim is not a ranking. It is a map: what each paper argued, why it
    mattered, and where later evidence has supported, complicated, or
    challenged it. Influence is not the same as being right, and a few of
    these are on the list precisely because the field has argued with them.
  # Shown in smaller type under the intro. HTML ok.
