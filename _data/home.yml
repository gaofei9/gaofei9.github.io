# Shown in search results and when the page is shared.
meta_description: >-
  Fei Gao, learning scientist and professor at Bowling Green State University.
  Writing on the science of learning, motivation, learning tools and
  techniques, and books about learning.


# ---------- Top of the page ----------
hero:
  eyebrow: "Learning scientist · Lifelong learner"
  name: "Fei Gao"
  lede: >-
    I study learning for a living, and I practice what I have learned about learning every day. I write
    about what helps people learn: the research on motivation and learning
    environments, the neuroscience of how brains change, and the tools and
    books that hold up when you try them. I invite you to be a scientist too,
    and experiment with your own learning.
  portrait_alt: "Fei Gao"
  primary_button:
    text: "Read the blog"
    link: "blog/"
  secondary_button:
    text: "Get in touch"
    link: "#contact"

# The three facts in the strip under the photo.
# Add or remove entries freely; each needs a label and a value.
credentials:
  - label: "Affiliation"
    value: "Bowling Green State University"
  - label: "Focus"
    value: "Learning analytics, gamification & simulation, online learning"
  - label: "Recognition"
    value: "Stanford/Elsevier Top 2% Scientists, 2025"


# ---------- What I write about ----------
# The four themes of the blog. When you tag posts, use the tag shown
# in the comment next to each card so posts group under these themes.
write_about:
  eyebrow: "What I write about"
  heading: "The science and practice of learning better"
  areas:
    - number: "I"                     # tag: science-of-learning
      title: "Science of learning"
      text: >-
        How learning works: memory, attention, and how brains change with
        practice. I read the research, mine and others', and write about
        what it means for everyday learning.
    - number: "II"                    # tag: motivation
      title: "Motivation"
      text: >-
        Why we start, why we quit, and what keeps us going. Motivation is my
        research home ground, and I write about how to put it to work in
        your own learning.
    - number: "III"                   # tag: tools
      title: "Tools & techniques"
      text: >-
        Mnemonics, spaced practice, retrieval, and other techniques with
        evidence behind them. What they are, when they help, and how to
        try them.
    - number: "IV"                    # tag: books
      title: "Ideas from books"
      text: >-
        Notes on books about learning, from Ultralearning to The Art of
        Learning. What each book claims, and how it squares with the
        research.


# ---------- About ----------
about:
  eyebrow: "About"
  heading: "A little background"
  pull_quote: >-
    Try something, watch what happens, adjust. Learning improves when we
    treat it as an experiment.
  # One entry per paragraph. HTML ok.
  paragraphs:
    - >-
      I am a Professor in Instructional Design and Technology at Bowling
      Green State University, where I also serve as Associate Dean for
      Faculty Affairs and Research. I earned my Ph.D. in Educational
      Psychology and Educational Technology from Michigan State University,
      and I have studied how people learn online ever since. My research is
      funded by the National Science Foundation, and I serve as Associate
      Editor for <em>Educational Technology &amp; Society</em> and the
      <em>Online Learning Journal</em>.
    - >-
      Away from work, I am an avid reader and a constant student. I read
      widely on the science of learning, from motivation to memory to brain
      plasticity, and I test the techniques on my own learning projects.
      This site is where the two halves meet. I write about research worth
      knowing, tools worth trying, and books worth reading, and I invite
      you to experiment with your own learning alongside me.


# ---------- Research summary on the homepage ----------
# The full research page lives at /research/ and is edited in
# _data/research.yml. The three papers shown here come from the top of
# the publication list in that file.
research_summary:
  eyebrow: "Research"
  heading: "The research behind the writing"
  copy: >-
    In my research I study how the design of online learning environments
    shapes motivation, participation, and learning, with recent projects on
    gamification, learning analytics dashboards, and virtual reality. A few
    papers are below, and the research page has the full picture.
  link_text: "All research and publications →"


