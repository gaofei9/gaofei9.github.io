# ---------- About ----------
about:
  eyebrow: "About"
  heading: "A little background"
  pull_quote: >-
    Technology improves learning when it meets students' needs for
    autonomy, competence, and relatedness. The design is what makes
    the difference.
  # One entry per paragraph. HTML ok.
  paragraphs:
    - >-
      I am a Professor in Instructional Design and Technology at Bowling
      Green State University, where I also serve as Associate Dean for
      Faculty Affairs and Research. I earned my Ph.D. in Educational
      Psychology and Educational Technology from Michigan State
      University, and I have studied online learning environments
      since then.
    - >-
      My recent work looks at how students manage their own learning in
      online STEM courses. With funding from the National Science
      Foundation, I led CLAIM-STEM, a project that helped undergraduates
      build the math skills they need for STEM programs. I am now
      studying how leaderboards and other game elements change what
      students do and how they feel about it, and how a learning
      analytics dashboard can show students something useful about their
      own progress. I serve as Associate Editor for
      <em>Educational Technology &amp; Society</em> and the
      <em>Online Learning Journal</em>.


# ---------- Research ----------
research:
  eyebrow: "Research"
  heading: "What I work on"
  # One entry per card. The number is just the label shown on the card.
  areas:
    - number: "I"
      title: "Learning analytics"
      text: >-
        I look for patterns in what students do in online courses, and I
        design dashboards that show students their own progress in a form
        they can act on.
    - number: "II"
      title: "Gamification and simulation"
      text: >-
        I study how game elements such as leaderboards, and simulations such
        as virtual reality, change what students learn and how much they want
        to keep going.
    - number: "III"
      title: "Motivation and affect in online learning"
      text: >-
        I examine how online courses meet students' needs for autonomy,
        competence, and relatedness, and how the emotions students feel while
        working shape what they learn.
    - number: "IV"
      title: "AI in education"
      text: >-
        I investigate how students and instructors use AI tools, including the
        differences in how various groups take them up and what they think of
        them.


