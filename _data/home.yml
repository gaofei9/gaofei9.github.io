# Shown in search results and when the page is shared.
meta_description: >-
  Fei Gao, Professor of Instructional Design and Technology at Bowling Green
  State University. Research on learning analytics, gamification and simulation, and
  motivation in online learning.


# ---------- Top of the page ----------
hero:
  eyebrow: "Professor of Instructional Design and Technology"
  name: "Fei Gao"
  lede: >-
    I am a learning scientist who studies how people learn in online environments
    and how the design of those environments shapes their motivation,
    participation, and learning. My work brings together learning analytics and
    motivation research to design environments that support learners' autonomy,
    competence, and capacity for self-regulated learning.
  portrait_alt: "Fei Gao"
  primary_button:
    text: "Explore my research"
    link: "#research"
  secondary_button:
    text: "Get in touch"
    link: "#contact"

