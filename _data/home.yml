# ---------- About ----------
about:
  eyebrow: "About"
  heading: "A little background"
  pull_quote: >-
    Technology improves learning when it meets students' needs for
    autonomy, competence, and relatedness. The design is what makes
    the difference.
  # One entry per paragraph. HTML ok.
  paragraphs:
    - >-
      I am a Professor in Instructional Design and Technology at Bowling
      Green State University, where I also serve as Associate Dean for
      Faculty Affairs and Research. I earned my Ph.D. in Educational
      Psychology and Educational Technology from Michigan State
      University, and I have studied online learning environments
      since then.
    - >-
      My recent work looks at how students learn in
      online STEM platforms. With funding from the National Science
      Foundation, I led a project that helped undergraduates
      build the math skills they need for STEM programs. I am now
      studying how leaderboards and other game elements change students' motivation, participation, and learning, and how a learning
      analytics dashboard can support self-regulated learning. I serve as Associate Editor for
      <em>Educational Technology &amp; Society</em> and the
      <em>Online Learning Journal</em>.


# ---------- Research ----------
research:
  eyebrow: "Research"
  heading: "Designing data-informed and motivating learning environments"
  # One entry per card. The number is just the label shown on the card.
  areas:
    - number: "I"
      title: "Learning analytics and self-regulated learning"
      text: >-
        I identify patterns in students' online learning behaviors and design
        actionable dashboards that help them monitor their progress, reflect
        on their learning, and regulate their learning strategies.
    - number: "II"
      title: "Gamification, simulation, and immersive learning"
      text: >-
        I investigate how gamified and simulated learning environments,
        including leaderboards and virtual reality, influence students'
        motivation, engagement, participation, and learning outcomes.
    - number: "III"
      title: "Motivation and emotion in online learning"
      text: >-
        I examine how motivational beliefs and emotional experiences shape
        students' engagement, participation, persistence, learning strategies,
        and academic outcomes in online environments.
    - number: "IV"
      title: "Artificial intelligence in education"
      text: >-
        I investigate how students and instructors perceive, adopt, and use
        artificial intelligence in educational settings, with attention to
        variation across learner and instructor populations.


