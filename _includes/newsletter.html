<section class="section">
  <div class="newsletter">
    <div>
      <p class="eyebrow">{{ site.data.home.newsletter.eyebrow }}</p>
      <h2>{{ site.data.home.newsletter.heading }}</h2>
      <p class="newsletter-copy">
        {{ site.data.home.newsletter.copy }}
      </p>
    </div>
    <form class="newsletter-form"
          action="https://buttondown.com/api/emails/embed-subscribe/gaofei9"
          method="post">
      <label class="visually-hidden" for="bd-email">Email address</label>
      <input type="email" name="email" id="bd-email" required
             placeholder="you@example.com" autocomplete="email">
      <button type="submit" class="btn btn-rose">{{ site.data.home.newsletter.button_text }}</button>
    </form>
  </div>
</section>
