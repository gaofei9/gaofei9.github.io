---
layout: default
---
<article class="section post">
  <header class="post-header">
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.tags.size > 0 %}
    <p class="post-tags">
      {% for tag in page.tags %}
      {% assign tag_slug = tag | slugify %}
      <a class="tag-chip" href="{{ '/tag/' | append: tag_slug | append: '/' | relative_url }}">{{ tag }}</a>
      {% endfor %}
    </p>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>

{% include newsletter.html %}
