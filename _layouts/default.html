<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · Fei Gao{% else %}Fei Gao{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>

  <nav class="nav">
    <a class="wordmark" href="{{ '/' | relative_url }}">FEI&nbsp;GAO</a>
    <div class="nav-links">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/research/' | relative_url }}">Research</a>
      <a href="{{ '/#contact' | relative_url }}" class="nav-cta">Contact</a>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <span>{{ site.data.home.footer.copyright }}</span>
    <span>
      {% for link in site.data.home.footer.links %}<a href="{{ link.url }}">{{ link.text }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    </span>
    <p class="footer-note">{{ site.data.home.footer.disclaimer }}</p>
  </footer>

</body>
</html>
