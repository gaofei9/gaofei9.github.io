title: Fei Gao
description: Fei Gao — researcher. Research, publications, and resources.
url: "https://gaofei9.github.io"

markdown: kramdown
permalink: /blog/:year/:title/

# Paste the share link of your contact form here (Google Forms, Microsoft
# Forms, Tally). While this is empty, the Contact button points at your BGSU
# faculty page instead, so it always works.
contact_form_url: ""

plugins:
  - jekyll-feed
  - jekyll-archives

jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: tag
  permalinks:
    tag: "/tag/:name/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .cursor
  - .mcp.json
  - "Blush Bronze Website Launch Promo Instagram Post.png"
